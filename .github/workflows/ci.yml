name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.22.1

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Build
        run: jaspr build
